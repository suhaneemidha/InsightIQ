<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; background: transparent; overflow: hidden; }
  #particle-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }
  .hero-container {
    position: relative;
    width: 100%;
    height: __HEIGHT__px;
    border-radius: 24px;
    background: radial-gradient(circle at top, #2E4540 0%, #1A1A1A 45%, #0B0909 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family:'Droid Sans',sans-serif;
  }
  .hero-inner {
    position: relative;
    z-index: 2;
    text-align: center;
    max-width: 760px;
    padding: 0 30px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background:rgba(46,69,64,.30);
    border:1px solid rgba(181,185,240,.18);
    border-radius: 999px;
    padding: 8px 18px;
    backdrop-filter:blur(18px);
    font-family:'Cabin',sans-serif;
    font-size: 0.9rem;
    letter-spacing:.05em;
    color: #B5B9F0;
    backdrop-filter: blur(16px);
    margin-bottom: 1.5rem;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #408175;
    box-shadow: 0 0 10px #22D3EE;
  }
  .title {
    font-family:'Oswald',sans-serif;
    font-size:clamp(3rem,6vw,5rem);
    font-weight: 600;
    letter-spacing:.04em;
    line-height:1.05;
    background: linear-gradient(135deg, #8B5CF6 0%, #22D3EE 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: fadeUp 0.8s ease forwards, gradientShift 6s ease infinite;
    opacity: 0;
    animation-delay: 0.1s, 0s;
    margin-bottom: 1.2rem;
  }
  .subtitle {
    font-size: 1.1rem;
    font-family:'Cabin',sans-serif;
    font-size:1.15rem;
    line-height:1.8;
    color:#D4D8E8;
    margin-bottom: 2rem;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards;
    animation-delay: 0.2s;
    max-width:620px;
    margin:0 auto 2.5rem;
  }
  .cta {
    display: inline-block;
    background: linear-gradient(135deg, #408175 0%, #B5B9F0 100%);
    color: #fff;
    font-family:'Cabin',sans-serif;
    font-size:1rem;
    font-weight: 600;
    padding: 1rem 2.5rem;
    border-radius: 14px;
    text-decoration: none;
    border: none;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(64,129,117,.28);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    opacity: 0;
    animation: fadeUp 0.9s ease forwards;
    animation-delay: 0.3s;
  }
  .cta:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 18px 35px rgba(64,129,117,.35);
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
</style>
</head>
<body>
  <div class="hero-container">
    <canvas id="particle-canvas"></canvas>
    <div class="hero-inner">
      <div class="badge"><span class="dot"></span>__BADGE_TEXT__</div>
      <div class="title">__TITLE__</div>
      <div class="subtitle">__SUBTITLE__</div>
      <button class="cta" onclick="window.parent.postMessage({type:'streamlit:cta_click'}, '*')">__CTA_TEXT__</button>
    </div>
  </div>

<script>
// ===========================================================
// PARTICLE BACKGROUND — connected glowing particles + mouse interaction
// ===========================================================
const canvas = document.getElementById('particle-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
let mouse = { x: null, y: null, radius: 120 };

function resize() {
  canvas.width = canvas.parentElement.offsetWidth;
  canvas.height = canvas.parentElement.offsetHeight;
}
resize();
window.addEventListener('resize', resize);

canvas.parentElement.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
});
canvas.parentElement.addEventListener('mouseleave', () => {
  mouse.x = null;
  mouse.y = null;
});

class Particle {
  constructor() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.vx = (Math.random() - 0.5) * 0.4;
    this.vy = (Math.random() - 0.5) * 0.4;
    this.radius = Math.random() * 1.8 + 0.6;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
    if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

    if (mouse.x !== null) {
      const dx = this.x - mouse.x;
      const dy = this.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < mouse.radius) {
        const force = (mouse.radius - dist) / mouse.radius;
        this.x += (dx / dist) * force * 1.2;
        this.y += (dy / dist) * force * 1.2;
      }
    }
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(181,185,240,.75)';
    ctx.shadowBlur = 8;
    ctx.shadowColor = '#408175';
    ctx.fill();
  }
}

function initParticles() {
  particles = [];
  const count = Math.floor((canvas.width * canvas.height) / 9000);
  for (let i = 0; i < count; i++) particles.push(new Particle());
}
initParticles();

function connect() {
  for (let a = 0; a < particles.length; a++) {
    for (let b = a + 1; b < particles.length; b++) {
      const dx = particles[a].x - particles[b].x;
      const dy = particles[a].y - particles[b].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 110) {
        ctx.beginPath();
        ctx.strokeStyle = `rgba(181,185,240, ${1 - dist / 110})`;
        ctx.lineWidth = 0.6;
        ctx.moveTo(particles[a].x, particles[a].y);
        ctx.lineTo(particles[b].x, particles[b].y);
        ctx.stroke();
      }
    }
  }
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => { p.update(); p.draw(); });
  connect();
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
